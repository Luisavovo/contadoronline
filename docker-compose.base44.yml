services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=contador
      - POSTGRES_PASSWORD=contador_pass
      - POSTGRES_DB=contadoronline
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./.base44/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contador -d contadoronline"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://contador:contador_pass@db:5432/contadoronline
      - DB_SSL=false
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx --yes nodemon --ignore node_modules --ignore package.json --ignore package-lock.json server.js"

volumes:
  db_data:
